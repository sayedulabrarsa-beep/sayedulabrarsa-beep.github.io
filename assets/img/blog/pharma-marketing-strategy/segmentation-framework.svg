<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="24" fill="#f7f1e6"/><text x="65" y="80" font-family="Arial" font-size="38" font-weight="700" fill="#174d50">Segment around relevant needs</text><g font-family="Arial" fill="#174d50"><rect x="70" y="145" width="330" height="390" rx="24" fill="#dce8e3"/><rect x="435" y="145" width="330" height="390" rx="24" fill="#f1dfc6"/><rect x="800" y="145" width="330" height="390" rx="24" fill="#e8d9d5"/><g font-size="27" font-weight="700" text-anchor="middle"><text x="235" y="220">THERAPEUTIC</text><text x="600" y="220">PROFESSIONAL</text><text x="965" y="220">MARKET</text></g><g font-size="22" text-anchor="middle"><text x="235" y="300">Clinical need</text><text x="235" y="350">Treatment context</text><text x="235" y="400">Evidence gap</text><text x="600" y="300">Specialty / setting</text><text x="600" y="350">Information need</text><text x="600" y="400">Access preference</text><text x="965" y="300">Geography</text><text x="965" y="350">Availability</text><text x="965" y="400">Affordability</text></g></g><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="23" fill="#5b6d68">Use only relevant, lawful and necessary professional information.</text></svg>