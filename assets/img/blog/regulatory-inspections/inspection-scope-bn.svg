<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">পরিদর্শনে কী কী দেখা হতে পারে</title><desc id="d">ছয়টি সংযুক্ত ক্ষেত্র; প্রকৃত scope প্রতিষ্ঠানভেদে আলাদা</desc><rect width="1600" height="900" fill="#f6f2e8"/><text x="800" y="105" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="44" font-weight="700" fill="#173f45">পরিদর্শনে কী কী দেখা হতে পারে</text><text x="800" y="160" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="24" fill="#687c78">ছয়টি সংযুক্ত ক্ষেত্র; প্রকৃত scope প্রতিষ্ঠানভেদে আলাদা</text><g><rect x="90" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="297" r="34" fill="#1f6267"/><text x="152" y="309" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="700" fill="#fff">১</text><text x="208" y="305" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" fill="#173f45">জনবল ও প্রশিক্ষণ</text><text x="208" y="357" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="21" fill="#637a78">দায়িত্ব, দক্ষতা ও hygiene</text></g><g><rect x="585" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="647" cy="297" r="34" fill="#1f6267"/><text x="647" y="309" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="700" fill="#fff">২</text><text x="703" y="305" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" fill="#173f45">ভবন ও utility</text><text x="703" y="357" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="21" fill="#637a78">কক্ষ, flow ও পরিবেশ</text></g><g><rect x="1080" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="1142" cy="297" r="34" fill="#1f6267"/><text x="1142" y="309" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="700" fill="#fff">৩</text><text x="1198" y="305" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" fill="#173f45">যন্ত্রপাতি ও system</text><text x="1198" y="357" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="21" fill="#637a78">রক্ষণাবেক্ষণ ও qualification</text></g><g><rect x="90" y="510" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="572" r="34" fill="#1f6267"/><text x="152" y="584" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="700" fill="#fff">৪</text><text x="208" y="580" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" fill="#173f45">উপকরণ ও supplier</text><text x="208" y="632" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="21" fill="#637a78">Status, testing ও traceability</text></g><g><rect x="585" y="510" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="647" cy="572" r="34" fill="#1f6267"/><text x="647" y="584" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="700" fill="#fff">৫</text><text x="703" y="580" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" fill="#173f45">প্রক্রিয়া ও নথি</text><text x="703" y="632" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="21" fill="#637a78">কাজ, data ও batch history</text></g><g><rect x="1080" y="510" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="1142" cy="572" r="34" fill="#1f6267"/><text x="1142" y="584" text-anchor="middle" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="32" font-weight="700" fill="#fff">৬</text><text x="1198" y="580" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="28" font-weight="700" fill="#173f45">সংরক্ষণ ও বিতরণ</text><text x="1198" y="632" font-family="Hind Siliguri, Noto Sans Bengali, sans-serif" font-size="21" fill="#637a78">শর্ত, নিরাপত্তা ও recall</text></g></svg>