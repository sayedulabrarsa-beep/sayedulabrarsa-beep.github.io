<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">পরিদর্শনে কী কী দেখা হতে পারে</title><desc id="d">ছয়টি সংযুক্ত ক্ষেত্র; প্রকৃত scope প্রতিষ্ঠানভেদে আলাদা</desc><rect width="1600" height="900" fill="#f6f2e8"/><text x="800" y="105" text-anchor="middle" font-size="46" font-weight="700" fill="#173f45">পরিদর্শনে কী কী দেখা হতে পারে</text><text x="800" y="160" text-anchor="middle" font-size="25" fill="#687c78">ছয়টি সংযুক্ত ক্ষেত্র; প্রকৃত scope প্রতিষ্ঠানভেদে আলাদা</text><g><rect x="90" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="297" r="34" fill="#1f6267"/><text x="152" y="309" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">১</text><text x="208" y="307" font-size="31" font-weight="700" fill="#173f45">জনবল ও প্রশিক্ষণ</text><text x="208" y="359" font-size="23" fill="#637a78">দায়িত্ব, দক্ষতা ও hygiene</text></g><g><rect x="590" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="652" cy="297" r="34" fill="#1f6267"/><text x="652" y="309" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">২</text><text x="708" y="307" font-size="31" font-weight="700" fill="#173f45">ভবন ও utility</text><text x="708" y="359" font-size="23" fill="#637a78">কক্ষ, flow ও পরিবেশ</text></g><g><rect x="1090" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="1152" cy="297" r="34" fill="#1f6267"/><text x="1152" y="309" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">৩</text><text x="1208" y="307" font-size="31" font-weight="700" fill="#173f45">যন্ত্রপাতি ও system</text><text x="1208" y="359" font-size="23" fill="#637a78">রক্ষণাবেক্ষণ ও qualification</text></g><g><rect x="90" y="505" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="567" r="34" fill="#1f6267"/><text x="152" y="579" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">৪</text><text x="208" y="577" font-size="31" font-weight="700" fill="#173f45">উপকরণ ও supplier</text><text x="208" y="629" font-size="23" fill="#637a78">Status, testing ও traceability</text></g><g><rect x="590" y="505" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="652" cy="567" r="34" fill="#1f6267"/><text x="652" y="579" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">৫</text><text x="708" y="577" font-size="31" font-weight="700" fill="#173f45">প্রক্রিয়া ও নথি</text><text x="708" y="629" font-size="23" fill="#637a78">কাজ, data ও batch history</text></g><g><rect x="1090" y="505" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="1152" cy="567" r="34" fill="#1f6267"/><text x="1152" y="579" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">৬</text><text x="1208" y="577" font-size="31" font-weight="700" fill="#173f45">সংরক্ষণ ও বিতরণ</text><text x="1208" y="629" font-size="23" fill="#637a78">শর্ত, নিরাপত্তা ও recall</text></g><path d="M520 330 H585 M1020 330 H1085 M1320 425 V500 M1080 595 H1015 M580 595 H515" fill="none" stroke="#d48c50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M570 312 L590 330 L570 348 M1070 312 L1090 330 L1070 348 M1300 480 L1320 500 L1340 480 M1035 577 L1015 595 L1035 613 M535 577 L515 595 L535 613" fill="none" stroke="#d48c50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>