<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">What inspectors may examine</title><desc id="d">Six connected areas; the exact scope depends on the site</desc><rect width="1600" height="900" fill="#f6f2e8"/><text x="800" y="105" text-anchor="middle" font-family="Poppins, sans-serif" font-size="46" font-weight="700" fill="#173f45">What inspectors may examine</text><text x="800" y="160" text-anchor="middle" font-family="Poppins, sans-serif" font-size="24" fill="#687c78">Six connected areas; the exact scope depends on the site</text><g><rect x="90" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="297" r="34" fill="#1f6267"/><text x="152" y="309" text-anchor="middle" font-family="Poppins, sans-serif" font-size="32" font-weight="700" fill="#fff">1</text><text x="208" y="305" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#173f45">People and training</text><text x="208" y="357" font-family="Poppins, sans-serif" font-size="21" fill="#637a78">Roles, competence and hygiene</text></g><g><rect x="585" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="647" cy="297" r="34" fill="#1f6267"/><text x="647" y="309" text-anchor="middle" font-family="Poppins, sans-serif" font-size="32" font-weight="700" fill="#fff">2</text><text x="703" y="305" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#173f45">Premises and utilities</text><text x="703" y="357" font-family="Poppins, sans-serif" font-size="21" fill="#637a78">Rooms, flow and environment</text></g><g><rect x="1080" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="1142" cy="297" r="34" fill="#1f6267"/><text x="1142" y="309" text-anchor="middle" font-family="Poppins, sans-serif" font-size="32" font-weight="700" fill="#fff">3</text>