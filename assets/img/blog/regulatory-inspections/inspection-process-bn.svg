<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">ঝুঁকিভিত্তিক পরিদর্শনের ধাপ</title><desc id="d">পরিকল্পনা থেকে follow-up পর্যন্ত একটি সহজ চিত্র</desc><rect width="1600" height="900" fill="#f6f2e8"/><text x="800" y="105" text-anchor="middle" font-size="46" font-weight="700" fill="#173f45">ঝুঁকিভিত্তিক পরিদর্শনের ধাপ</text><text x="800" y="160" text-anchor="middle" font-size="25" fill="#687c78">পরিকল্পনা থেকে follow-up পর্যন্ত একটি সহজ চিত্র</text><g><rect x="90" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="297" r="34" fill="#1f6267"/><text x="152" y="309" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">১</text><text x="208" y="307" font-size="31" font-weight="700" fill="#173f45">ঝুঁকি পরিকল্পনা</text><text x="208" y="359" font-size="23" fill="#637a78">উদ্দেশ্য, scope ও দল নির্ধারণ</text></g><g><rect x="590" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="652" cy="297" r="34" fill="#1f6267"/><text x="652" y="309" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">২</text><text x="708" y="307" font-size="31" font-weight="700" fill="#173f45">উদ্বোধনী সভা</text><text x="708" y="359" font-size="23" fill="#637a78">ক্ষমতা ও যোগাযোগ নিশ্চিত</text></g><g><rect x="1090" y="235" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="1152" cy="297" r="34" fill="#1f6267"/><text x="1152" y="309" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">৩</text><text x="1208" y="307" font-size="31" font-weight="700" fill="#173f45">পরিদর্শন ও সাক্ষাৎকার</text><text x="1208" y="359" font-size="23" fill="#637a78">কাজ দেখা ও প্রশ্ন করা</text></g><g><rect x="90" y="505" width="430" height="190" rx="26" fill="#fffdf7" stroke="#b9cdc7" stroke-width="5"/><circle cx="152" cy="567" r="34" fill="#1f6267"/><