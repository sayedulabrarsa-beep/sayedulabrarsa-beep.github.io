<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Illustrative temperature-controlled pharmaceutical shipping pack-out</title>
<desc id="d">A cutaway view of an insulated shipping container shows an outer carton, insulation, conditioned coolant packs separated from the medicine, a product carton and a digital temperature data logger. The configuration is illustrative and must be qualified for the product and route.</desc>
<rect width="1600" height="900" fill="#f8f3e9"/>
<text x="90" y="100" fill="#173d43" font-family="Arial,sans-serif" font-size="46" font-weight="700">A shipper is a designed system</text>
<text x="90" y="150" fill="#5d7070" font-family="Arial,sans-serif" font-size="25">The pack-out must be qualified for the product, route, season and transit time.</text>
<g transform="translate(120 220)">
