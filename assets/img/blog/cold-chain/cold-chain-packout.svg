<path d="M920 560 L1190 670 H1510" stroke="#d46e4c" stroke-width="5" fill="none"/><circle cx="920" cy="560" r="9" fill="#d46e4c"/><text x="1510" y="650" text-anchor="end" font-weight="700">Temperature data logger</text><text x="1510" y="682" text-anchor="end">records the journey</text>
