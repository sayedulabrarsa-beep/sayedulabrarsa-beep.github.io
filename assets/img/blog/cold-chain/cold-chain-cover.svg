<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Pharmaceutical cold chain journey</title><desc id="desc">Original bilingual vector diagram showing medicines moving from manufacturer through qualified storage and monitored transport to a pharmacy or hospital and then to the patient, with temperature records at each hand-off.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="54" y="54" width="1492" height="792" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="105" y="150" font-family="Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="3" fill="#287c73">MEDICINE QUALITY · ওষুধের গুণগত মান</text>
<text x="105" y="235" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#173d43">Pharmaceutical Cold Chain</text>
<text x="105" y="290" font-family="Arial,sans-serif" font-size="32" fill="#536966">তাপমাত্রা-সংবেদনশীল ওষুধের প্রতিটি ধাপে নিয়ন্ত্রিত যাত্রা</text>
<path d="M220 540 H1380" stroke="#b9d4ca" stroke-width="14" stroke-linecap="round"/><path d="M220 540 H1380" stroke="#287c73" stroke-width="4" stroke-dasharray="12 20"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(220 540)"><circle r="72" fill="#e4f0ea" stroke="#287c73" stroke-width="5"/><path d="M-28 18V-26H28V18M-35 18H35M-18 -26V-42H18V-26" fill="none" stroke="#173d43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text y="116" font-size="27" font-weight="700" fill="#173d43">Manufacturer</text><text y="151" font-size="22" fill="#536966">উৎপাদনকারী</text></g>
<g transform="translate(510 540)"><circle r="72" fill="#e4f0ea" stroke="#287c73" stroke-width="5"/><path d="M-35 28V-18L0 -42L35 -18V28Z M-15 28V-4H15V28" fill="none" stroke="#173d43" stroke-width="7" stroke-linejoin="round"/><text y="116" font-size="27" font-weight="700" fill="#173d43">Storage</text><text y="151" font-size="22" fill="#536966">সংরক্ষণ</text></g>
<g transform="translate(800 540)"><circle r="72" fill="#e4f0ea" stroke="#287c73" stroke-width="5"/><rect x="-36" y="-25" width="72" height="50" rx="10" fill="none" stroke="#173d43" stroke-width="7"/><path d="M-18 -25V-39H18V-25M-20 25L-34 42M20 25L34 42" fill="none" stroke="#173d43" stroke-width="7" stroke-linecap="round"/><text y="116" font-size="27" font-weight="700" fill="#173d43">Transport</text><text y="151" font-size="22" fill="#536966">পরিবহন</text></g>
<g transform="translate(1090 540)"><circle r="72" fill="#e4f0ea" stroke="#287c73" stroke-width="5"/><path d="M-34 30V-20L0 -40L34 -20V30Z M-13 30V-5H13V30" fill="none" stroke="#173d43" stroke-width="7" stroke-linejoin="round"/><text y="116" font-size="27" font-weight="700" fill="#173d43">Pharmacy / Hospital</text><text y="151" font-size="22" fill="#536966">ফার্মেসি / হাসপাতাল</text></g>
<g transform="translate(1380 540)"><circle r="72" fill="#fff0dc" stroke="#d18a43" stroke-width="5"/><circle cy="-18" r="18" fill="none" stroke="#173d43" stroke-width="7"/><path d="M-31 35Q-30 2 0 2Q30 2 31 35" fill="none" stroke="#173d43" stroke-width="7" stroke-linecap="round"/><text y="116" font-size="27" font-weight="700" fill="#173d43">Patient</text><text y="151" font-size="22" fill="#536966">রোগী</text></g>
</g>
<rect x="105" y="760" width="1390" height="2" fill="#d6e2dc"/><text x="105" y="805" font-family="Arial,sans-serif" font-size="25" fill="#536966">Qualified conditions · Temperature records · Documented hand-offs</text><text x="1490" y="805" text-anchor="end" font-family="Arial,sans-serif" font-size="25" fill="#536966">নির্ধারিত পরিবেশ · তাপমাত্রার নথি · দায়িত্ব হস্তান্তর</text>
</svg>