<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Pharmacokinetics versus pharmacodynamics</title>
<desc id="desc">A two-part educational diagram. Pharmacokinetics follows a medicine through absorption, distribution, metabolism and excretion to describe exposure over time. Pharmacodynamics shows the medicine interacting with a biological target to create a response.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#e9f3ef"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7775"/><stop offset="1" stop-color="#17464b"/></linearGradient>
 <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc66a"/><stop offset="1" stop-color="#df853e"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183f43" flood-opacity=".12"/></filter>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<text x="800" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#173d43">Two sides of pharmacology</text>
<text x="800" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#587276">Exposure and response are connected — but they are not the same</text>
<rect x="70" y="190" width="700" height="610" rx="30" fill="#ffffff" filter="url(#shadow)"/>
<rect x="830" y="190" width="700" height="610" rx="30" fill="#ffffff" filter="url(#shadow)"/>
<rect x="70" y="190" width="700" height="120" rx="30" fill="url(#teal)"/>
<path d="M70 280h700v30H70z" fill="url(#teal)"/>
<text x="420" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#ffffff">PHARMACOKINETICS (PK)</text>
<text x="420" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d8efea">What the body does to the medicine</text>
<rect x="830" y="190" width="700" height="120" rx="30" fill="url(#amber)"/>
<path d="M830 280h700v30H830z" fill="url(#amber)"/>
<text x="1180" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#173d43">PHARMACODYNAMICS (PD)</text>
<text x="1180" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#3f5555">What the medicine does to the body</text>
<!-- PK journey -->
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g fill="#e7f2ef" stroke="#a9cbc3" stroke-width="2">
  <rect x="112" y="365" width="260" height="105" rx="18"/><rect x="468" y="365" width="260" height="105" rx="18"/>
  <rect x="112" y="520" width="260" height="105" rx="18"/><rect x="468" y="520" width="260" height="105" rx="18"/>
 </g>
 <g fill="#145c60" font-size="27" font-weight="700"><text x="242" y="409">A — Absorption</text><text x="598" y="409">D — Distribution</text><text x="242" y="564">M — Metabolism</text><text x="598" y="564">E — Excretion</text></g>
 <g fill="#536d70" font-size="19"><text x="242" y="443">Enters circulation</text><text x="598" y="443">Moves into tissues</text><text x="242" y="598">Chemically changed</text><text x="598" y="598">Leaves the body</text></g>
 <g stroke="#df9b4c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M372 417h82l-15 -13m15 13l-15 13"/><path d="M598 470v36l-13 -14m13 14l13 -14"/><path d="M468 573h-82l15 -13m-15 13l15 13"/></g>
 <rect x="190" y="690" width="460" height="66" rx="18" fill="#173d43"/>
 <text x="420" y="733" font-size="25" font-weight="700" fill="#ffffff">DRUG EXPOSURE OVER TIME</text>
</g>
<!-- PD receptor -->
<g transform="translate(850 350)">
 <rect x="45" y="12" width="590" height="175" rx="24" fill="#fff5e6" stroke="#f0d1a0" stroke-width="2"/>
 <g transform="translate(110 42)">
  <path d="M0 70 C25 15 50 15 75 70 S125 125 150 70 S200 15 225 70" fill="none" stroke="#0e7775" stroke-width="16" stroke-linecap="round"/>
  <path d="M103 4v44m0 0l-18 -18m18 18l18 -18" stroke="#df853e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="103" cy="2" r="19" fill="url(#amber)" stroke="#c77b38" stroke-width="3"/>
  <path d="M270 70h90" stroke="#df9b4c" stroke-width="8" stroke-linecap="round"/>
  <path d="M344 54l18 16 -18 16" fill="none" stroke="#df9b4c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="410" cy="70" r="46" fill="#e0f0eb" stroke="#0e7775" stroke-width="4"/>
  <path d="M410 42v56m-28 -28h56" stroke="#0e7775" stroke-width="9" stroke-linecap="round"/>
 </g>
 <text x="340" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173d43">Drug + biological target → response</text>
 <g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="28" y="270" width="250" height="112" rx="18" fill="#e7f2ef" stroke="#a9cbc3" stroke-width="2"/>
  <rect x="312" y="270" width="300" height="112" rx="18" fill="#fff0dc" stroke="#f0d1a0" stroke-width="2"/>
  <text x="153" y="315" font-size="25" font-weight="700" fill="#145c60">POTENCY</text><text x="153" y="349" font-size="18" fill="#536d70">How much is needed?</text>
  <text x="462" y="315" font-size="25" font-weight="700" fill="#9a5a24">EFFICACY</text><text x="462" y="349" font-size="18" fill="#536d70">How large can the effect be?</text>
 </g>
 <rect x="115" y="425" width="420" height="68" rx="18" fill="#173d43"/>
 <text x="325" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffffff">BIOLOGICAL RESPONSE</text>
</g>
<text x="800" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#587276">PK helps shape exposure • PD explains the effect at that exposure</text>
</svg>