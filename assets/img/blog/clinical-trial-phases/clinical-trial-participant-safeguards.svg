<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How clinical trial participants are protected</title>
<desc id="desc">Five connected safeguards: a scientific protocol, independent ethics review, understandable informed consent, ongoing safety monitoring, and confidentiality with the right to withdraw.</desc>
<!-- Original vector artwork by Sayedul Abrar, 25 November 2026. No third-party visual assets. -->
<rect width="1600" height="900" fill="#fbfaf6"/>
<text x="90" y="115" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#287c73">PARTICIPANT PROTECTION</text>
<text x="90" y="180" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#173d43">Safety is built into the study</text>
<g font-family="Arial,sans-serif">
<path d="M250 410 H1350" stroke="#b9cbc2" stroke-width="12" stroke-linecap="round"/>
<g transform="translate(90 290)"><rect width="270" height="300" rx="24" fill="#e7efea" stroke="#a9c1b5" stroke-width="3"/><circle cx="135" cy="78" r="43" fill="#174f52"/><text x="135" y="93" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">1</text><text x="135" y="165" text-anchor="middle" font-size="27" font-weight="700" fill="#173d43">Protocol</text><text x="135" y="210" text-anchor="middle" font-size="20" fill="#536a68">Clear question,</text><text x="135" y="240" text-anchor="middle" font-size="20" fill="#536a68">methods &amp; risk plan</text></g>
<g transform="translate(390 290)"><rect width="270" height="300" rx="24" fill="#edf2e8" stroke="#bdcba0" stroke-width="3"/><circle cx="135" cy="78" r="43" fill="#287c73"/><text x="135" y="93" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">2</text><text x="135" y="165" text-anchor="middle" font-size="27" font-weight="700" fill="#173d43">Ethics review</text><text x="135" y="210" text-anchor="middle" font-size="20" fill="#536a68">Independent</text><text x="135" y="240" text-anchor="middle" font-size="20" fill="#536a68">IRB / IEC oversight</text></g>
<g transform="translate(690 290)"><rect width="270" height="300" rx="24" fill="#f7e9df" stroke="#d9aa8d" stroke-width="3"/><circle cx="135" cy="78" r="43" fill="#c56b42"/><text x="135" y="93" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">3</text><text x="135" y="165" text-anchor="middle" font-size="27" font-weight="700" fill="#173d43">Informed consent</text><text x="135" y="210" text-anchor="middle" font-size="20" fill="#536a68">Understand risks,</text><text x="135" y="240" text-anchor="middle" font-size="20" fill="#536a68">choice &amp; alternatives</text></g>
<g transform="translate(990 290)"><rect width="270" height="300" rx="24" fill="#e9edf2" stroke="#b0bfcd" stroke-width="3"/><circle cx="135" cy="78" r="43" fill="#47748c"/><text x="135" y="93" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">4</text><text x="135" y="165" text-anchor="middle" font-size="27" font-weight="700" fill="#173d43">Monitoring</text><text x="135" y="210" text-anchor="middle" font-size="20" fill="#536a68">Check events,</text><text x="135" y="240" text-anchor="middle" font-size="20" fill="#536a68">deviations &amp; data</text></g>
<g transform="translate(1290 290)"><rect width="230" height="300" rx="24" fill="#f2eddc" stroke="#d7c38b" stroke-width="3"/><circle cx="115" cy="78" r="43" fill="#b18a39"/><text x="115" y="93" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">5</text><text x="115" y="165" text-anchor="middle" font-size="25" font-weight="700" fill="#173d43">Rights</text><text x="115" y="210" text-anchor="middle" font-size="19" fill="#536a68">Privacy &amp; the</text><text x="115" y="240" text-anchor="middle" font-size="19" fill="#536a68">right to withdraw</text></g>
</g>
<rect x="140" y="675" width="1320" height="105" rx="22" fill="#173d43"/>
<text x="800" y="740" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Participation must be informed, voluntary and monitored throughout.</text>
</svg>