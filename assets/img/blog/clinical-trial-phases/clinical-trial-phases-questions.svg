<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The question changes at each clinical trial phase</title>
<desc id="desc">Four panels explain the main question in each phase: tolerability and dose, early activity, confirmation of benefit and risk, and longer-term follow-up after approval.</desc>
<!-- Original vector artwork by Sayedul Abrar, 25 November 2026. No third-party visual assets. -->
<rect width="1600" height="900" fill="#f5f1e8"/>
<text x="90" y="110" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#287c73">FOUR PHASES · FOUR QUESTIONS</text>
<text x="90" y="175" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#173d43">What are researchers trying to learn?</text>
<g font-family="Arial,sans-serif">
<g transform="translate(90 250)"><rect width="330" height="470" rx="26" fill="#e4efea" stroke="#9ab9ac" stroke-width="3"/><circle cx="165" cy="95" r="48" fill="#174f52"/><text x="165" y="111" text-anchor="middle" fill="#fff" font-size="42" font-weight="700">I</text><text x="165" y="205" text-anchor="middle" fill="#174f52" font-size="27" font-weight="700">PHASE I</text><text x="165" y="275" text-anchor="middle" fill="#173d43" font-size="30" font-weight="700">Can people</text><text x="165" y="315" text-anchor="middle" fill="#173d43" font-size="30" font-weight="700">tolerate it?</text><text x="165" y="390" text-anchor="middle" fill="#536a68" font-size="21">Safety · Dose · PK/PD</text></g>
<g transform="translate(480 250)"><rect width="330" height="470" rx="26" fill="#e9f0e4" stroke="#b4c69a" stroke-width="3"/><circle cx="165" cy="95" r="48" fill="#287c73"/><text x="165" y="111" text-anchor="middle" fill="#fff" font-size="37" font-weight="700">II</text><text x="165" y="205" text-anchor="middle" fill="#287c73" font-size="27" font-weight="700">PHASE II</text><text x="165" y="275" text-anchor="middle" fill="#173d43" font-size="30" font-weight="700">Is there an</text><text x="165" y="315" text-anchor="middle" fill="#173d43" font-size="30" font-weight="700">early signal?</text><text x="165" y="390" text-anchor="middle" fill="#536a68" font-size="21">Activity · Dose range</text></g>
<g transform="translate(870 250)"><rect width="330" height="470" rx="26" fill="#f7e9df" stroke="#d9aa8d" stroke-width="3"/><circle cx="165" cy="95" r="48" fill="#c56b42"/><text x="165" y="111" text-anchor="middle" fill="#fff" font-size="35" font-weight="700">III</text><text x="165" y="205" text-anchor="middle" fill="#b65d37" font-size="27" font-weight="700">PHASE III</text><text x="165" y="275" text-anchor="middle" fill="#173d43" font-size="30" font-weight="700">Is benefit–risk</text><text x="165" y="315" text-anchor="middle" fill="#173d43" font-size="30" font-weight="700">confirmed?</text><text x="165" y="390" text-anchor="middle" fill="#536a68" font-size="21">Larger groups · Comparison</text></g>
<g transform="translate(1260 250)"><rect width="250" height="470" rx="26" fill="#f2eddc" stroke="#d7c38b" stroke-width="3"/><circle cx="125" cy="95" r="48" fill="#b18a39"/><text x="125" y="111" text-anchor="middle" fill="#fff" font-size="35" font-weight="700">IV</text><text x="125" y="205" text-anchor="middle" fill="#9b7426" font-size="27" font-weight="700">PHASE IV</text><text x="125" y="275" text-anchor="middle" fill="#173d43" font-size="27" font-weight="700">What happens</text><text x="125" y="315" text-anchor="middle" fill="#173d43" font-size="27" font-weight="700">after approval?</text><text x="125" y="390" text-anchor="middle" fill="#536a68" font-size="20">Longer follow-up</text></g>
</g>
<text x="90" y="815" font-family="Arial,sans-serif" font-size="23" fill="#536a68">Safety is assessed throughout every phase. The emphasis changes; it never disappears.</text>
</svg>