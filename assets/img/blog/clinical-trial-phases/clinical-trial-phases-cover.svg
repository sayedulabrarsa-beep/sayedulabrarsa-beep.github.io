<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Clinical trial phases: from first-in-human to post-marketing</title>
<desc id="desc">An original editorial diagram showing the four clinical trial phases as connected stages, from early safety and dose studies to post-marketing follow-up.</desc>
<!-- Original vector artwork by Sayedul Abrar, 25 November 2026. No third-party visual assets. -->
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f3e9"/><stop offset="1" stop-color="#e8f0eb"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174f52"/><stop offset="1" stop-color="#287c73"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1370" cy="130" r="210" fill="#e1ebe4"/><circle cx="1370" cy="130" r="150" fill="none" stroke="#c3d6cc" stroke-width="3"/>
<text x="110" y="170" fill="#174f52" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="5">SCIENCE OF MEDICINE DEVELOPMENT</text>
<text x="110" y="275" fill="#173d43" font-family="Arial,sans-serif" font-size="76" font-weight="700">Clinical trial</text>
<text x="110" y="360" fill="#173d43" font-family="Arial,sans-serif" font-size="76" font-weight="700">phases</text>
<text x="114" y="430" fill="#536a68" font-family="Arial,sans-serif" font-size="31">From first-in-human to post-marketing</text>
<path d="M150 625 H1450" stroke="#b5c9c0" stroke-width="10" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(230 625)"><circle r="74" fill="#174f52"/><text y="18" fill="#fff" font-size="48" font-weight="700">I</text><text y="125" fill="#174f52" font-size="28" font-weight="700">SAFETY</text><text y="164" fill="#536a68" font-size="21">Dose &amp; tolerability</text></g>
<g transform="translate(610 625)"><circle r="74" fill="#287c73"/><text y="18" fill="#fff" font-size="48" font-weight="700">II</text><text y="125" fill="#174f52" font-size="28" font-weight="700">EARLY SIGNAL</text><text y="164" fill="#536a68" font-size="21">Activity &amp; dose range</text></g>
<g transform="translate(990 625)"><circle r="74" fill="#c56b42"/><text y="18" fill="#fff" font-size="48" font-weight="700">III</text><text y="125" fill="#174f52" font-size="28" font-weight="700">CONFIRMATION</text><text y="164" fill="#536a68" font-size="21">Benefit–risk evidence</text></g>
<g transform="translate(1370 625)"><circle r="74" fill="#b18a39"/><text y="18" fill="#fff" font-size="48" font-weight="700">IV</text><text y="125" fill="#174f52" font-size="28" font-weight="700">FOLLOW-UP</text><text y="164" fill="#536a68" font-size="21">After authorisation</text></g>
</g>
<text x="110" y="845" fill="#71827c" font-family="Arial,sans-serif" font-size="20">A phase answers a different research question. The sequence can vary by medicine and development programme.</text>
</svg>