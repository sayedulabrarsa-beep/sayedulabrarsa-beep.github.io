<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Out-of-specification result investigation</title><desc id="desc">Original bilingual vector infographic showing a laboratory result outside its acceptance range, followed by evidence-based investigation and a documented batch decision.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="110" y="145" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="3" fill="#287c73">PHARMACEUTICAL QUALITY · ফার্মাসিউটিক্যাল গুণগত মান</text>
<text x="110" y="235" font-family="Arial,sans-serif" font-size="61" font-weight="700" fill="#173d43">Out-of-Specification (OOS)</text>
<text x="110" y="290" font-family="Arial,sans-serif" font-size="32" fill="#536966">পরীক্ষার ফল specification-এর বাইরে গেলে কী হয়?</text>
<rect x="110" y="360" width="1380" height="180" rx="22" fill="#eef5f1" stroke="#c9dcd3" stroke-width="3"/>
<text x="160" y="415" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173d43">ILLUSTRATIVE ACCEPTANCE RANGE · ধারণাগত গ্রহণযোগ্য সীমা</text>
<rect x="235" y="455" width="980" height="28" rx="14" fill="#b8d8c8"/><rect x="235" y="455" width="180" height="28" rx="14" fill="#d18a43"/><rect x="1215" y="455" width="180" height="28" rx="14" fill="#d56a53"/>
<path d="M1410 435V505" stroke="#d56a53" stroke-width="8" stroke-linecap="round"/><circle cx="1410" cy="470" r="17" fill="#d56a53"/>
<text x="235" y="515" font-family="Arial,sans-serif" font-size="21" fill="#536966">Below limit</text><text x="725" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#287c73">Within specification</text><text x="1395" y="515" text-anchor="end" font-family="Arial,sans-serif" font-size="21" fill="#a54d3f">Outside limit</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="120" y="630" width="380" height="125" rx="20" fill="#e4f0ea" stroke="#287c73" stroke-width="3"/><text x="310" y="683" font-size="31" font-weight="700" fill="#173d43">1 · Detect</text><text x="310" y="722" font-size="23" fill="#536966">ফলাফল শনাক্ত করুন</text>
<path d="M520 692H585" stroke="#d18a43" stroke-width="8" stroke-linecap="round"/><path d="M568 674L590 692L568 710" fill="none" stroke="#d18a43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="610" y="630" width="380" height="125" rx="20" fill="#fff0dc" stroke="#d18a43" stroke-width="3"/><text x="800" y="683" font-size="31" font-weight="700" fill="#173d43">2 · Investigate</text><text x="800" y="722" font-size="23" fill="#536966">প্রমাণভিত্তিক তদন্ত</text>
<path d="M1010 692H1075" stroke="#d18a43" stroke-width="8" stroke-linecap="round"/><path d="M1058 674L1080 692L1058 710" fill="none" stroke="#d18a43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1100" y="630" width="380" height="125" rx="20" fill="#f9e8e3" stroke="#d56a53" stroke-width="3"/><text x="1290" y="683" font-size="31" font-weight="700" fill="#173d43">3 · Decide</text><text x="1290" y="722" font-size="23" fill="#536966">ব্যাচের নথিবদ্ধ সিদ্ধান্ত</text>
<text x="800" y="805" font-size="25" font-weight="700" fill="#173d43">A result is a signal — not a verdict. · একটি ফলাফল সতর্ক সংকেত—চূড়ান্ত সিদ্ধান্ত নয়।</text>
</g></svg>