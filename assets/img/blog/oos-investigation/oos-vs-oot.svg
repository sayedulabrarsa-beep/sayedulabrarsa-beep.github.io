<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">OOS, OOT and deviation compared</title><desc id="desc">Bilingual comparison of an out-of-specification result, an out-of-trend result and a deviation from an approved procedure.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="105" y="145" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173d43">OOS vs OOT vs Deviation</text><text x="105" y="198" font-family="Arial,sans-serif" font-size="28" fill="#536966">তিনটি আলাদা ধারণা—তবে একে অপরের সঙ্গে সম্পর্ক থাকতে পারে</text>
<g font-family="Arial,sans-serif">
<rect x="105" y="275" width="430" height="470" rx="24" fill="#f9e8e3" stroke="#d56a53" stroke-width="3"/><text x="145" y="345" font-size="42" font-weight="700" fill="#a54d3f">OOS</text><text x="145" y="392" font-size="25" font-weight="700" fill="#173d43">Outside specification</text><text x="145" y="432" font-size="23" fill="#536966">নির্ধারিত গ্রহণযোগ্য সীমার বাইরে</text><path d="M160 500H470" stroke="#d9e2dc" stroke-width="12" stroke-linecap="round"/><path d="M160 500H260" stroke="#d56a53" stroke-width="12" stroke-linecap="round"/><circle cx="160" cy="500" r="18" fill="#d56a53"/><text x="145" y="585" font-size="23" fill="#173d43">A test result is beyond an</text><text x="145" y="620" font-size="23" fill="#173d43">approved acceptance limit.</text><text x="145" y="680" font-size="22" fill="#536966">সন্দেহভাজন ফল তদন্তের পর</text><text x="145" y="713" font-size="22" fill="#536966">confirmed হতে পারে।</text>
<rect x="585" y="275" width="430" height="470" rx="24" fill="#fff0dc" stroke="#d18a43" stroke-width="3"/><text x="625" y="345" font-size="42" font-weight="700" fill="#b16b2f">OOT</text><text x="625" y="392" font-size="25" font-weight="700" fill="#173d43">Out of trend</text><text x="625" y="432" font-size="23" fill="#536966">সীমার ভেতরে, কিন্তু অস্বাভাবিক প্রবণতা</text><path d="M640 500H950" stroke="#d9e2dc" stroke-width="12" stroke-linecap="round"/><path d="M650 515L720 500L790 490L860 455L940 440" fill="none" stroke="#d18a43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="625" y="585" font-size="23" fill="#173d43">The result may still pass, but</text><text x="625" y="620" font-size="23" fill="#173d43">the pattern deserves review.</text><text x="625" y="680" font-size="22" fill="#536966">Trend review আগেই সমস্যা</text><text x="625" y="713" font-size="22" fill="#536966">চিহ্নিত করতে পারে।</text>
<rect x="1065" y="275" width="430" height="470" rx="24" fill="#e4f0ea" stroke="#287c73" stroke-width="3"/><text x="1105" y="345" font-size="42" font-weight="700" fill="#287c73">Deviation</text><text x="1105" y="392" font-size="25" font-weight="700" fill="#173d43">Process / procedure departure</text><text x="1105" y="432" font-size="23" fill="#536966">অনুমোদিত পদ্ধতি থেকে বিচ্যুতি</text><rect x="1110" y="475" width="310" height="60" rx="12" fill="#c9dfd4"/><text x="1265" y="514" text-anchor="middle" font-size="22" font-weight="700" fill="#173d43">Approved step</text><path d="M1265 535V575L1350 610" fill="none" stroke="#d56a53" stroke-width="8" stroke-linecap="round"/><text x="1105" y="680" font-size="22" fill="#536966">May or may not produce an</text><text x="1105" y="713" font-size="22" fill="#536966">OOS result. · OOS হতে পারে, নাও পারে।</text>
</g></svg>