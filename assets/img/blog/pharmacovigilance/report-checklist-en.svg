<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Safety report information checklist</title><desc id="d">Five groups of information that make an adverse-event report useful.</desc><rect width="1600" height="900" rx="36" fill="#f6f7f2"/><rect x="220" y="100" width="1160" height="700" rx="42" fill="#fff" stroke="#b7d4cc" stroke-width="8"/><text x="800" y="190" text-anchor="middle" font-size="44" font-weight="700" font-family="Arial" fill="#17464a">What to include in a safety report</text><g transform="translate(340 260)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="34" font-family="Arial" fill="#28454a">Patient and relevant history</text></g><g transform="translate(340 360)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="34" font-family="Arial" fill="#28454a">Event, onset and outcome</text></g><g transform="translate(340 460)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="34" font-family="Arial" fill="#28454a">Medicine, dose and batch</text></g><g transform="translate(340 560)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="34" font-family="Arial" fill="#28454a">Other medicines and possible causes</text></g><g transform="translate(340 660)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="34" font-family="Arial" fill="#28454a">Reporter contact details</text></g><text x="800" y="770" text-anchor="middle" font-size="22" font-family="Arial" fill="#607578">Use authorised reporting channels and protect personal information.</text></svg>