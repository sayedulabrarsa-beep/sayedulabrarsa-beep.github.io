<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Pharmacovigilance cycle</title><desc id="d">Six connected steps from event identification to action and communication.</desc><rect width="1600" height="900" rx="36" fill="#f4f8f5"/><text x="800" y="78" text-anchor="middle" font-size="42" font-family="Arial" font-weight="700" fill="#17464a">A continuous medicine-safety learning cycle</text><g><rect x="100" y="150" width="360" height="170" rx="28" fill="#f5c7a9" stroke="#245c5c" stroke-width="5"/><circle cx="160" cy="205" r="28" fill="#245c5c"/><text x="160" y="216" text-anchor="middle" font-size="30" font-family="Arial" fill="#fff">1</text><text x="280" y="262" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#183e43">Notice event</text></g><g><rect x="600" y="150" width="360" height="170" rx="28" fill="#d9eee6" stroke="#245c5c" stroke-width="5"/><circle cx="660" cy="205" r="28" fill="#245c5c"/><text x="660" y="216" text-anchor="middle" font-size="30" font-family="Arial" fill="#fff">2</text><text x="780" y="262" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#183e43">Document details</text></g><g><rect x="1100" y="150" width="360" height="170" rx="28" fill="#b7d9d2" stroke="#245c5c" stroke-width="5"/><circle cx="1160" cy="205" r="28" fill="#245c5c"/><text x="1160" y="216" text-anchor="middle" font-size="30" font-family="Arial" fill="#fff">3</text><text x="1280" y="262" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#183e43">Report &amp; validate</text></g><g><rect x="100" y="520" width="360" height="170" rx="28" fill="#f7dfb5" stroke="#245c5c" stroke-width="5"/><circle cx="160" cy="575" r="28" fill="#245c5c"/><text x="160" y="586" text-anchor="middle" font-size="30" font-family="Arial" fill="#fff">4</text><text x="280" y="632" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#183e43">Assess the case</text></g><g><rect x="600" y="520" width="360" height="170" rx="28" fill="#c4d8ee" stroke="#245c5c" stroke-width="5"/><circle cx="660" cy="575" r="28" fill="#245c5c"/><text x="660" y="586" text-anchor="middle" font-size="30" font-family="Arial" fill="#fff">5</text><text x="780" y="632" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#183e43">Analyse signals</text></g><g><rect x="1100" y="520" width="360" height="170" rx="28" fill="#e9cde3" stroke="#245c5c" stroke-width="5"/><circle cx="1160" cy="575" r="28" fill="#245c5c"/><text x="1160" y="586" text-anchor="middle" font-size="30" font-family="Arial" fill="#fff">6</text><text x="1280" y="632" text-anchor="middle" font-size="32" font-weight="700" font-family="Arial" fill="#183e43">Act &amp; communicate</text></g><g fill="none" stroke="#2b8178" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M460 235h110l-25-24m25 24-25 24"/><path d="M960 235h110l-25-24m25 24-25 24"/><path d="M1275 340v150l-24-25m24 25 24-25"/><path d="M1070 605H960l25-24m-25 24 25 24"/><path d="M570 605H460l25-24m-25 24 25 24"/><path d="M275 520V370l-24 25m24-25 24 25"/></g></svg>