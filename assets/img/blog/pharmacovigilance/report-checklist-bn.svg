<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">নিরাপত্তা রিপোর্টের তথ্য</title><desc id="d">একটি উপযোগী adverse event রিপোর্টে যে পাঁচ ধরনের তথ্য থাকা দরকার তার চেকলিস্ট।</desc><rect width="1600" height="900" rx="36" fill="#f6f7f2"/><rect x="220" y="100" width="1160" height="700" rx="42" fill="#fff" stroke="#b7d4cc" stroke-width="8"/><text x="800" y="190" text-anchor="middle" font-size="44" font-weight="700" font-family="sans-serif" fill="#17464a">রিপোর্টে যে তথ্যগুলো দিন</text><g transform="translate(340 260)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="32" font-family="sans-serif" fill="#28454a">রোগী ও প্রাসঙ্গিক ইতিহাস</text></g><g transform="translate(340 360)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="32" font-family="sans-serif" fill="#28454a">ঘটনার লক্ষণ, শুরু ও ফলাফল</text></g><g transform="translate(340 460)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="32" font-family="sans-serif" fill="#28454a">ওষুধের নাম, ডোজ ও ব্যাচ</text></g><g transform="translate(340 560)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="32" font-family="sans-serif" fill="#28454a">অন্য ওষুধ ও সম্ভাব্য কারণ</text></g><g transform="translate(340 660)"><circle cx="40" cy="20" r="27" fill="#2a8178"/><path d="M26 20l10 10 20-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="32" font-size="32" font-family="sans-serif" fill="#28454a">রিপোর্টকারীর যোগাযোগ</text></g><text x="800" y="770" text-anchor="middle" font-size="22" font-family="Arial" fill="#607578">ব্যক্তিগত তথ্য কেবল অনুমোদিত ও গোপনীয় রিপোর্টিং চ্যানেলে দিন।</text></svg>