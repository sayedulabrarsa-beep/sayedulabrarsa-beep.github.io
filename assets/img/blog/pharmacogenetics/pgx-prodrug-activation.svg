<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A gene can influence prodrug activation</title><desc id="desc">Original bilingual conceptual diagram showing a prodrug requiring an enzyme to form an active metabolite. For clopidogrel, CYP2C19 activity contributes to active-metabolite formation; reduced function can reduce activation. Clinical interpretation is drug-specific and must follow current guidance.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="105" y="145" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173d43">Prodrug activation depends on enzymes</text><text x="105" y="198" font-family="Arial,sans-serif" font-size="29" fill="#536966">কিছু prodrug সক্রিয় হতে নির্দিষ্ট এনজাইমের সাহায্য চায়</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="110" y="340" width="340" height="190" rx="22" fill="#eef5f1" stroke="#287c73" stroke-width="4"/><rect x="225" y="395" width="110" height="55" rx="27" fill="#fffdf8" stroke="#287c73" stroke-width="5"/><text x="280" y="480" font-size="31" font-weight="700" fill="#173d43">Prodrug</text><text x="280" y="515" font-size="22" fill="#536966">কম সক্রিয় / inactive form</text>
<path d="M450 435H610" stroke="#d18a43" stroke-width="8"/><path d="M590 416L613 435L590 454" fill="none" stroke="#d18a43" stroke-width="8" stroke-linejoin="round"/>
<rect x="635" y="340" width="340" height="190" rx="22" fill="#fff0dc" stroke="#d18a43" stroke-width="4"/><circle cx="805" cy="425" r="52" fill="none" stroke="#173d43" stroke-width="8"/><path d="M778 425H832M805 398V452" stroke="#173d43" stroke-width="7" stroke-linecap="round"/><text x="805" y="500" font-size="31" font-weight="700" fill="#173d43">Enzyme</text><text x="805" y="535" font-size="22" fill="#536966">উদাহরণ: CYP2C19</text>
<path d="M975 435H1135" stroke="#d18a43" stroke-width="8"/><path d="M1115 416L1138 435L1115 454" fill="none" stroke="#d18a43" stroke-width="8" stroke-linejoin="round"/>
<rect x="1160" y="340" width="330" height="190" rx="22" fill="#e4f0ea" stroke="#287c73" stroke-width="4"/><path d="M1250 420H1400M1325 375V465" stroke="#287c73" stroke-width="9" stroke-linecap="round"/><text x="1325" y="500" font-size="31" font-weight="700" fill="#173d43">Active metabolite</text><text x="1325" y="535" font-size="22" fill="#536966">সক্রিয় metabolite</text>
<rect x="150" y="640" width="1300" height="125" rx="22" fill="#f9e8e3" stroke="#d56a53" stroke-width="3"/><text x="800" y="690" font-size="29" font-weight="700" fill="#a54d3f">Clopidogrel example</text><text x="800" y="735" font-size="25" fill="#173d43">Reduced CYP2C19 function can reduce active-metabolite formation.</text><text x="800" y="770" font-size="22" fill="#536966">এটি ওষুধ-নির্দিষ্ট উদাহরণ; নিজে থেকে চিকিৎসা পরিবর্তন করবেন না।</text>
</g></svg>