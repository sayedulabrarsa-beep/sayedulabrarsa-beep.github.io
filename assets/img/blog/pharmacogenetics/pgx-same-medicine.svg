<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Same medicine, different possible response</title><desc id="desc">Original bilingual vector diagram showing two hypothetical people receiving the same labelled dose but having different enzyme activity and potentially different medicine exposure or response. The direction and clinical meaning depend on the specific drug, gene and patient context.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="105" y="145" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#173d43">Same labelled dose ≠ identical response</text><text x="105" y="198" font-family="Arial,sans-serif" font-size="29" fill="#536966">একই ডোজ হলেও সবার ওষুধের মাত্রা বা প্রতিক্রিয়া এক নাও হতে পারে</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="115" y="285" width="1370" height="130" rx="22" fill="#eef5f1" stroke="#c9dcd3" stroke-width="3"/><text x="800" y="340" font-size="34" font-weight="700" fill="#173d43">Same medicine · Same labelled dose</text><text x="800" y="385" font-size="25" fill="#536966">একই ওষুধ · একই লেবেল-নির্দেশিত ডোজ</text>
<path d="M800 415V470M800 470H425V520M800 470H1175V520" fill="none" stroke="#d18a43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="135" y="520" width="580" height="190" rx="22" fill="#e4f0ea" stroke="#287c73" stroke-width="4"/><text x="425" y="580" font-size="32" font-weight="700" fill="#173d43">Person A</text><text x="425" y="625" font-size="26" fill="#536966">Enzyme activity: one pattern</text><text x="425" y="665" font-size="23" fill="#536966">এনজাইমের কার্যকারিতা: একটি ধরন</text>
<rect x="885" y="520" width="580" height="190" rx="22" fill="#fff0dc" stroke="#d18a43" stroke-width="4"/><text x="1175" y="580" font-size="32" font-weight="700" fill="#173d43">Person B</text><text x="1175" y="625" font-size="26" fill="#536966">Enzyme activity: another pattern</text><text x="1175" y="665" font-size="23" fill="#536966">এনজাইমের কার্যকারিতা: ভিন্ন ধরন</text>
<path d="M425 710V760M1175 710V760" stroke="#287c73" stroke-width="7" stroke-linecap="round"/>
<rect x="135" y="765" width="1330" height="62" rx="15" fill="#f9e8e3" stroke="#d56a53" stroke-width="2"/><text x="800" y="805" font-size="24" font-weight="700" fill="#173d43">Exposure or response may differ; direction depends on the specific drug and gene. · প্রভাবের দিক ও মাত্রা ওষুধ ও জিনভেদে আলাদা।</text>
</g></svg>