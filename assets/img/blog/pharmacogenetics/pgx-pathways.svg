<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Four ways genes can influence medicine response</title>
<desc id="d">A bilingual educational diagram showing effects on drug metabolism, transport, drug targets and immune-related risk.</desc>
<rect width="1600" height="900" rx="28" fill="#f7f4ec"/>
<text x="90" y="100" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#174f52">FOUR ROUTES FROM GENE TO RESPONSE</text>
<text x="90" y="145" font-family="Arial,sans-serif" font-size="25" fill="#58706e">জিন থেকে ওষুধের প্রতিক্রিয়ায় প্রভাবের চারটি পথ</text>
<g transform="translate(90 205)">
<rect width="680" height="260" rx="26" fill="#e8f1ed" stroke="#b9d1c8" stroke-width="3"/>
<circle cx="110" cy="112" r="56" fill="#176267"/><path d="M84 80 C140 105 80 130 136 154 M136 80 C80 105 140 130 84 154" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M90 91 L130 91 M86 117 L134 117 M90 143 L130 143" stroke="#e9a24a" stroke-width="6"/>
<text x="200" y="82" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#174f52">1. METABOLISM</text>
<text x="200" y="120" font-family="Arial,sans-serif" font-size="25" fill="#174f52">বিপাক · enzyme activity</text>
<text x="200" y="168" font-family="Arial,sans-serif" font-size="22" fill="#405a58">Changes how quickly a drug is</text>
<text x="200" y="199" font-family="Arial,sans-serif" font-size="22" fill="#405a58">activated or broken down.</text>
<text x="200" y="230" font-family="Arial,sans-serif" font-size="20" fill="#405a58">ওষুধ সক্রিয় বা ভাঙার গতি বদলাতে পারে</text>
</g>
<g transform="translate(830 205)">
<rect width="680" height="260" rx="26" fill="#fff0df" stroke="#e6c49a" stroke-width="3"/>
<circle cx="110" cy="112" r="56" fill="#d77a55"/><rect x="78" y="73" width="64" height="78" rx="16" fill="none" stroke="#fff" stroke-width="8"/><path d="M88 97 H132 M88 124 H132" stroke="#fff" stroke-width="7"/>
<text x="200" y="82" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#174f52">2. TRANSPORT</text>
<text x="200" y="120" font-family="Arial,sans-serif" font-size="25" fill="#174f52">পরিবহন · transporter</text>
<text x="200" y="168" font-family="Arial,sans-serif" font-size="22" fill="#405a58">Changes how a drug enters</text>
<text x="200" y="199" font-family="Arial,sans-serif" font-size="22" fill="#405a58">or leaves cells and tissues.</text>
<text x="200" y="230" font-family="Arial,sans-serif" font-size="20" fill="#405a58">কোষে প্রবেশ বা বের হওয়া বদলাতে পারে</text>
</g>
<g transform="translate(90 500)">
<rect width="680" height="260" rx="26" fill="#e9edf5" stroke="#c1cbdc" stroke-width="3"/>
<circle cx="110" cy="112" r="56" fill="#536d9a"/><path d="M74 132 Q110 55 146 132" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="110" cy="91" r="14" fill="#e9a24a"/>
<text x="200" y="82" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#174f52">3. DRUG TARGET</text>
<text x="200" y="120" font-family="Arial,sans-serif" font-size="25" fill="#174f52">ওষুধের লক্ষ্য · receptor / target</text>
<text x="200" y="168" font-family="Arial,sans-serif" font-size="22" fill="#405a58">Changes the target or pathway</text>
<text x="200" y="199" font-family="Arial,sans-serif" font-size="22" fill="#405a58">that a medicine acts on.</text>
<text x="200" y="230" font-family="Arial,sans-serif" font-size="20" fill="#405a58">ওষুধের কাজের লক্ষ্য বা pathway বদলাতে পারে</text>
</g>
<g transform="translate(830 500)">
<rect width="680" height="260" rx="26" fill="#f4e9ee" stroke="#dfc2d0" stroke-width="3"/>
<circle cx="110" cy="112" r="56" fill="#8c5873"/><path d="M110 65 L150 83 V112 C150 139 129 155 110 166 C91 155 70 139 70 112 V83 Z" fill="none" stroke="#fff" stroke-width="8"/><path d="M91 111 L105 125 L132 95" fill="none" stroke="#e9a24a" stroke-width="8" stroke-linecap="round"/>
<text x="200" y="82" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#174f52">4. IMMUNE RISK</text>
<text x="200" y="120" font-family="Arial,sans-serif" font-size="25" fill="#174f52">রোগপ্রতিরোধী ঝুঁকি · HLA</text>
<text x="200" y="168" font-family="Arial,sans-serif" font-size="22" fill="#405a58">Some variants can raise the risk</text>
<text x="200" y="199" font-family="Arial,sans-serif" font-size="22" fill="#405a58">of a specific immune reaction.</text>
<text x="200" y="230" font-family="Arial,sans-serif" font-size="20" fill="#405a58">কিছু variant নির্দিষ্ট immune reaction-এর ঝুঁকি বাড়ায়</text>
</g>
<text x="90" y="835" font-family="Arial,sans-serif" font-size="20" fill="#637574">One gene does not predict every part of a person's response. Clinical context still matters.</text>
<metadata>Original bilingual educational vector diagram created for SayedulAbrar.site by Sayedul Abrar, 26 November 2026. No external image assets used.</metadata>
</svg>