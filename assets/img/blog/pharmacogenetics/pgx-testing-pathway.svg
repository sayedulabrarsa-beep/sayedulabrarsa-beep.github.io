<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">How pharmacogenetic testing can inform a clinical decision</title>
<desc id="d">A six-step pathway from a clinical question through sample collection, laboratory analysis, result interpretation, clinician decision and monitoring.</desc>
<rect width="1600" height="900" rx="28" fill="#f7f4ec"/>
<text x="90" y="105" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#174f52">FROM A CLINICAL QUESTION TO A CARE PLAN</text>
<text x="90" y="150" font-family="Arial,sans-serif" font-size="25" fill="#58706e">চিকিৎসার প্রশ্ন থেকে উপযুক্ত পরিকল্পনা</text>
<g font-family="Arial,sans-serif">
<g transform="translate(90 260)"><rect width="400" height="210" rx="24" fill="#e8f1ed" stroke="#b9d1c8" stroke-width="3"/><circle cx="55" cy="55" r="30" fill="#176267"/><text x="55" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1</text><text x="105" y="62" font-size="27" font-weight="700" fill="#174f52">Clinical question</text><text x="105" y="100" font-size="22" fill="#174f52">চিকিৎসার প্রশ্ন</text><text x="35" y="150" font-size="21" fill="#405a58">Is there a validated gene–drug</text><text x="35" y="180" font-size="21" fill="#405a58">relationship relevant here?</text></g>
<g transform="translate(600 260)"><rect width="400" height="210" rx="24" fill="#fff0df" stroke="#e6c49a" stroke-width="3"/><circle cx="55" cy="55" r="30" fill="#d77a55"/><text x="55" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2</text><text x="105" y="62" font-size="27" font-weight="700" fill="#174f52">Sample</text><text x="105" y="100" font-size="22" fill="#174f52">নমুনা সংগ্রহ</text><text x="35" y="150" font-size="21" fill="#405a58">Blood, saliva or a cheek swab</text><text x="35" y="180" font-size="21" fill="#405a58">may provide DNA.</text></g>
<g transform="translate(1110 260)"><rect width="400" height="210" rx="24" fill="#e9edf5" stroke="#c1cbdc" stroke-width="3"/><circle cx="55" cy="55" r="30" fill="#536d9a"/><text x="55" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3</text><text x="105" y="62" font-size="27" font-weight="700" fill="#174f52">Lab analysis</text><text x="105" y="100" font-size="22" fill="#174f52">ল্যাবরেটরি পরীক্ষা</text><text x="35" y="150" font-size="21" fill="#405a58">The assay checks the variants</text><text x="35" y="180" font-size="21" fill="#405a58">included in its validated panel.</text></g>
<path d="M500 365 H580 M565 350 L585 365 L565 380 M1010 365 H1090 M1075 350 L1095 365 L1075 380" stroke="#b68b43" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(1110 555)"><rect width="400" height="210" rx="24" fill="#f4e9ee" stroke="#dfc2d0" stroke-width="3"/><circle cx="55" cy="55" r="30" fill="#8c5873"/><text x="55" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">4</text><text x="105" y="62" font-size="27" font-weight="700" fill="#174f52">Interpretation</text><text x="105" y="100" font-size="22" fill="#174f52">ফল ব্যাখ্যা</text><text x="35" y="150" font-size="21" fill="#405a58">Genotype is translated into a</text><text x="35" y="180" font-size="21" fill="#405a58">gene-specific predicted function.</text></g>
<g transform="translate(600 555)"><rect width="400" height="210" rx="24" fill="#e8f1ed" stroke="#b9d1c8" stroke-width="3"/><circle cx="55" cy="55" r="30" fill="#176267"/><text x="55" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">5</text><text x="105" y="62" font-size="27" font-weight="700" fill="#174f52">Clinical decision</text><text x="105" y="100" font-size="22" fill="#174f52">চিকিৎসকের সিদ্ধান্ত</text><text x="35" y="150" font-size="21" fill="#405a58">Combine the result with the full</text><text x="35" y="180" font-size="21" fill="#405a58">clinical picture and guideline.</text></g>
<g transform="translate(90 555)"><rect width="400" height="210" rx="24" fill="#fff0df" stroke="#e6c49a" stroke-width="3"/><circle cx="55" cy="55" r="30" fill="#d77a55"/><text x="55" y="64" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">6</text><text x="105" y="62" font-size="27" font-weight="700" fill="#174f52">Follow-up</text><text x="105" y="100" font-size="22" fill="#174f52">পর্যবেক্ষণ</text><text x="35" y="150" font-size="21" fill="#405a58">Monitor benefit, adverse effects</text><text x="35" y="180" font-size="21" fill="#405a58">and other clinical factors.</text></g>
<path d="M1310 485 V535 M1295 520 L1310 540 L1325 520 M1090 660 H1020 M1035 645 L1015 660 L1035 675 M580 660 H510 M525 645 L505 660 L525 675" stroke="#b68b43" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="90" y="830" font-family="Arial,sans-serif" font-size="21" fill="#637574">A test result informs care; it does not replace a clinician's assessment or routine monitoring.</text>
<metadata>Original bilingual educational vector diagram created for SayedulAbrar.site by Sayedul Abrar, 26 November 2026. No external image assets used.</metadata>
</svg>