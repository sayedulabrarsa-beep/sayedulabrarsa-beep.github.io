<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Pharmacogenetics and medicine response</title><desc id="desc">Original bilingual vector diagram showing how inherited genetic variation can influence enzymes, transporters, drug targets and immune-related proteins, which may change medicine exposure or response. Genes are one part of clinical decision-making.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="110" y="145" font-family="Arial,sans-serif" font-size="35" font-weight="700" letter-spacing="2" fill="#287c73">PRECISION MEDICINE · ব্যক্তিভেদে ওষুধের প্রতিক্রিয়া</text>
<text x="110" y="235" font-family="Arial,sans-serif" font-size="61" font-weight="700" fill="#173d43">Pharmacogenetics</text>
<text x="110" y="292" font-family="Arial,sans-serif" font-size="31" fill="#536966">How inherited variation can influence medicine response · জিনগত পার্থক্য ওষুধের প্রতিক্রিয়ায় কীভাবে প্রভাব ফেলতে পারে</text>
