<rect x="110" y="755" width="1380" height="58" rx="14" fill="#edf4f1"/><text x="800" y="792" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173d43">Genes are one factor — not a stand-alone treatment decision. · জিন একমাত্র নির্ধারক নয়; চিকিৎসার সিদ্ধান্তও নয়।</text>
