<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Generic Name vs Brand Name</title><desc id="desc">A clean visual showing active ingredient on one side and product brand on the other.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20243b"/><stop offset="1" stop-color="#34395a"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd477"/><stop offset="1" stop-color="#f5a623"/></linearGradient></defs><rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="1030" cy="85" r="180" fill="#4d5379" opacity=".25"/><circle cx="140" cy="590" r="210" fill="#20b9b1" opacity=".10"/><text x="72" y="84" fill="#ffd477" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">PHARMACOLOGY MADE SIMPLE</text><text x="72" y="158" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">GENERIC NAME</text><text x="72" y="214" fill="#ffd477" font-family="Arial,sans-serif" font-size="29" font-weight="700">= ACTIVE INGREDIENT</text><rect x="72" y="258" width="470" height="175" rx="24" fill="#fff" opacity=".08" stroke="#6b7399" stroke-width="2"/><path d="M130 340a35 35 0 0 1 35-35h95a35 35 0 0 1 0 70h-95a35 35 0 0 1-35-35z" fill="#f7f7fb"/><path d="M212 305h48a35 35 0 0 1 0 70h-48z" fill="url(#gold)"/><path d="M212 305v70" stroke="#a9adc2" stroke-width="3"/><text x="290" y="335" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">PARACETAMOL</text><text x="290" y="370" fill="#c7cbe0" font-family="Arial,sans-serif" font-size="18">Example generic name</text><text x="590" y="362" fill="#ffd477" font-family="Arial,sans-serif" font-size="50" font-weight="700">VS</text><text x="690" y="158" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="700">BRAND NAME</text><text x="690" y="214" fill="#ffd477" font-family="Arial,sans-serif" font-size="29" font-weight="700">= PRODUCT IDENTITY</text><rect x="690" y="258" width="438" height="175" rx="24" fill="#fff" opacity=".08" stroke="#6b7399" stroke-width="2"/><rect x="736" y="298" width="120" height="92" rx="13" fill="#fff"/><rect x="736" y="298" width="120" height="28" rx="13" fill="url(#gold)"/><rect x="736" y="315" width="120" height="11" fill="url(#gold)"/><text x="796" y="355" fill="#20243b" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="700">PANADOL</text><text x="883" y="335" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">PANADOL</text><text x="883" y="370" fill="#c7cbe0" font-family="Arial,sans-serif" font-size="18">Example brand name</text><path d="M72 482H1128" stroke="#6b7399" stroke-width="2"/><text x="72" y="538" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">What is the ingredient? What is the product called?</text><text x="72" y="582" fill="#c7cbe0" font-family="Arial,sans-serif" font-size="22">জেনেরিক = উপাদান  •  ব্র্যান্ড = পণ্যের নাম</text></svg>