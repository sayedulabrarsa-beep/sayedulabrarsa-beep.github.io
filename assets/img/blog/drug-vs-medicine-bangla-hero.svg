<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Drug vs Medicine — ওষুধ আর ড্রাগ কি একই?</title>
<desc id="desc">An educational illustration comparing pharmaceutical drug ingredients and finished medicine products, with colorful capsules and tablets.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20243B"/><stop offset="1" stop-color="#343B5B"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD46A"/><stop offset="1" stop-color="#F39A23"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#83E2D7"/><stop offset="1" stop-color="#21A6A6"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#101426" flood-opacity=".28"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#FFFFFF" opacity=".08"/></pattern>
</defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/>
<rect width="1200" height="630" rx="28" fill="url(#dots)"/>
<circle cx="1060" cy="90" r="170" fill="#FFFFFF" opacity=".035"/>
<circle cx="1050" cy="555" r="210" fill="#20B2AA" opacity=".08"/>
