<text x="64" y="190" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">DRUG <tspan fill="#FFD46A">vs</tspan> MEDICINE</text>
<text x="67" y="246" fill="#E5EAF7" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700">ওষুধ আর ড্রাগ কি একই?</text>
