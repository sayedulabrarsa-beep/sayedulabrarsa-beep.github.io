<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Three arms of a stability study</title><desc id="d">Conditions are selected for the product and target market. General ICH Q1A(R2) examples only; product and market determine the protocol.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbf5e9"/><stop offset="1" stop-color="#e8f1ed"/></linearGradient></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="800" y="112" text-anchor="middle" font-family="Inter,sans-serif" font-size="52" font-weight="800" fill="#174f52">Three arms of a stability study</text><text x="800" y="178" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" fill="#526d82">Conditions are selected for the product and target market</text><g transform="translate(90 300)"><rect width="450" height="390" rx="24" fill="#fff" stroke="#174f52" stroke-width="4"/><rect width="450" height="18" rx="9" fill="#174f52"/><circle cx="225" cy="92" r="38" fill="#174f52" opacity=".14"/><path d="M208 95 h34 M225 78 v34" stroke="#174f52" stroke-width="7" stroke-linecap="round"/><text x="225" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="31" font-weight="800" fill="#174f52">LONG-TERM</text><foreignObject x="22" y="205" width="406" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,sans-serif;font-size:24px;line-height:1.5;color:#253238;text-align:center;font-weight:600">25°C/60% RH or 30°C/65% RH</div></foreignObject></g><g transform="translate(575 300)"><rect width="450" height="390" rx="24" fill="#fff" stroke="#526d82" stroke-width="4"/><rect width="450" height="18" rx="9" fill="#526d82"/><circle cx="225" cy="92" r="38" fill="#526d82" opacity=".14"/><path d="M208 95 h34 M225 78 v34" stroke="#526d82" stroke-width="7" stroke-linecap="round"/><text x="225" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="31" font-weight="800" fill="#174f52">ACCELERATED</text><foreignObject x="22" y="205" width="406" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,sans-serif;font-size:24px;line-height:1.5;color:#253238;text-align:center;font-weight:600">40°C/75% RH</div></foreignObject></g><g transform="translate(1060 300)"><rect width="450" height="390" rx="24" fill="#fff" stroke="#d8a84e" stroke-width="4"/><rect width="450" height="18" rx="9" fill="#d8a84e"/><circle cx="225" cy="92" r="38" fill="#d8a84e" opacity=".14"/><path d="M208 95 h34 M225 78 v34" stroke="#d8a84e" stroke-width="7" stroke-linecap="round"/><text x="225" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="31" font-weight="800" fill="#174f52">INTERMEDIATE</text><foreignObject x="22" y="205" width="406" height="145"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,sans-serif;font-size:24px;line-height:1.5;color:#253238;text-align:center;font-weight:600">30°C/65% RH</div></foreignObject></g><rect x="100" y="755" width="1400" height="82" rx="18" fill="#dcebe7"/><text x="800" y="806" text-anchor="middle" font-family="Inter,sans-serif" font-size="24" font-weight="600" fill="#174f52">General ICH Q1A(R2) examples only; product and market determine the protocol.</text></svg>