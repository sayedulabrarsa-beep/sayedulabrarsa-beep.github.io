<text x="160" y="51" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fffdf8">CALENDAR</text>
<g fill="#173d43" font-family="Arial,sans-serif" text-anchor="middle" font-size="25"><text x="52" y="135">M</text><text x="105" y="135">T</text><text x="160" y="135">W</text><text x="215" y="135">T</text><text x="268" y="135">F</text></g>
<g fill="#536966" font-family="Arial,sans-serif" text-anchor="middle" font-size="24"><text x="52" y="190">1</text><text x="105" y="190">2</text><text x="160" y="190">3</text><text x="215" y="190">4</text><text x="268" y="190">5</text><text x="52" y="245">8</text><text x="105" y="245">9</text><text x="160" y="245">10</text><text x="215" y="245">11</text><text x="268" y="245">12</text></g>
<circle cx="268" cy="300" r="27" fill="#d56a53"/><text x="268" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fffdf8">30</text>
</g>
<rect x="130" y="795" width="1340" height="2" fill="#d6e2dc"/><text x="130" y="825" font-family="Arial,sans-serif" font-size="23" fill="#536966">Illustrative label only — always follow the actual pack, leaflet and product-specific instructions.</text>
