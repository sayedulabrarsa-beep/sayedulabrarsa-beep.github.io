<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How to read manufacturing and expiry dates on a medicine pack</title><desc id="desc">Original bilingual vector diagram of a generic medicine carton label with clearly separated MFG, EXP and batch-number fields, alongside a calendar. The example dates are illustrative only.</desc>
<rect width="1600" height="900" fill="#f6f2e7"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fffdf8" stroke="#d6e2dc" stroke-width="3"/>
<text x="110" y="145" font-family="Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="2" fill="#287c73">MEDICINE LABEL · ওষুধের লেবেল</text>
<text x="110" y="235" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#173d43">MFG ≠ EXP</text>
<text x="110" y="292" font-family="Arial,sans-serif" font-size="31" fill="#536966">Manufacturing date is not the expiry date · উৎপাদন ও মেয়াদোত্তীর্ণের তারিখ এক নয়</text>
<g transform="translate(130 365)">
<path d="M0 80L120 0H820L930 80V420H0Z" fill="#e4f0ea" stroke="#287c73" stroke-width="7" stroke-linejoin="round"/>
<path d="M0 80H930" stroke="#287c73" stroke-width="7"/>
<rect x="65" y="125" width="800" height="245" rx="22" fill="#fffdf8" stroke="#cbded5" stroke-width="4"/>
<g font-family="Arial,sans-serif">
<rect x="105" y="165" width="220" height="155" rx="15" fill="#eef5f1"/><text x="215" y="220" text-anchor="middle" font-size="34" font-weight="700" fill="#287c73">MFG</text><text x="215" y="270" text-anchor="middle" font-size="32" font-weight="700" fill="#173d43">05/2025</text><text x="215" y="305" text-anchor="middle" font-size="18" fill="#536966">Manufactured</text>
<rect x="355" y="165" width="220" height="155" rx="15" fill="#fff0dc"/><text x="465" y="220" text-anchor="middle" font-size="34" font-weight="700" fill="#b16b2f">EXP</text><text x="465" y="270" text-anchor="middle" font-size="32" font-weight="700" fill="#173d43">04/2027</text><text x="465" y="305" text-anchor="middle" font-size="18" fill="#536966">Expiry</text>
<rect x="605" y="165" width="220" height="155" rx="15" fill="#f9e8e3"/><text x="715" y="220" text-anchor="middle" font-size="31" font-weight="700" fill="#a54d3f">B.No.</text><text x="715" y="270" text-anchor="middle" font-size="32" font-weight="700" fill="#173d43">A123</text><text x="715" y="305" text-anchor="middle" font-size="18" fill="#536966">Batch / Lot</text>
</g>
</g>
<g transform="translate(1130 385)">
