<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How immunogenicity is assessed for a biosimilar</title>
<desc id="desc">A biologic medicine may trigger anti-drug antibodies. Some antibodies bind the medicine, while some may neutralize its activity. The clinical impact is assessed for each product and patient context.</desc>
<rect width="1200" height="675" rx="30" fill="#F7F3EA"/>
<text x="64" y="86" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D">Why immunogenicity is assessed</text>
<g transform="translate(90 185)"><circle cx="110" cy="110" r="76" fill="#E7EEF7"/><path d="M65 108 C82 54 125 62 123 102 S172 158 159 112 S102 91 105 148" fill="none" stroke="#0F766E" stroke-width="14" stroke-linecap="round"/><text x="110" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D">Biologic medicine</text></g>
<path d="M315 295 H425" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/><path d="M405 275 L430 295 L405 315" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(450 185)"><circle cx="110" cy="110" r="76" fill="#E9F3EF"/><circle cx="110" cy="110" r="43" fill="#0F766E"/><path d="M110 45 V10 M110 210 V175 M45 110 H10 M210 110 H175 M64 64 L38 38 M156 156 L182 182 M156 64 L182 38 M64 156 L38 182" stroke="#D97706" stroke-width="12" stroke-linecap="round"/><text x="110" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D">Immune system</text></g>
<path d="M675 295 H785" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/><path d="M765 275 L790 295 L765 315" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(815 185)"><circle cx="110" cy="110" r="76" fill="#FFF0DE"/><path d="M110 48 V91 M110 91 L73 128 M110 91 L147 128" stroke="#D97706" stroke-width="18" stroke-linecap="round"/><circle cx="73" cy="133" r="14" fill="#0F766E"/><circle cx="147" cy="133" r="14" fill="#0F766E"/><text x="110" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D">Anti-drug antibodies</text></g>
<g transform="translate(110 480)"><rect width="445" height="82" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="222" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Binding antibodies</text><text x="222" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#526477">May bind without blocking activity</text></g>
<g transform="translate(645 480)"><rect width="445" height="82" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="222" y="34" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Neutralizing antibodies</text><text x="222" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#526477">Can reduce biological activity</text></g>
<text x="600" y="620" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" fill="#64748B">Not every antibody is neutralizing; clinical relevance is product-specific.</text>
</svg>