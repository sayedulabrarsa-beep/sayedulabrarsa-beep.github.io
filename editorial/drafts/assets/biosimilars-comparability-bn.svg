<text x="600" y="580" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" fill="#526477">একটি পরীক্ষা নয়—সব প্রমাণ একসঙ্গে বিবেচনা করা হয়</text>
