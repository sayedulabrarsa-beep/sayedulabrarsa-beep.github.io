<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">বায়োসিমিলার মূল্যায়নের ধাপ</title>
<desc id="desc">Reference product বোঝা, analytical comparison, functional assay, প্রয়োজন অনুযায়ী clinical evidence এবং সব প্রমাণ একত্রে বিবেচনার পাঁচটি ধাপ।</desc>
<rect width="1200" height="675" rx="30" fill="#F7F3EA"/>
<text x="64" y="86" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D">বায়োসিমিলার কীভাবে মূল্যায়ন করা হয়</text>
<path d="M120 310 H1080" stroke="#B7C7C1" stroke-width="12" stroke-linecap="round"/>
<g><circle cx="120" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="120" y="323" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">1</text></g><g><circle cx="360" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="360" y="323" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">2</text></g><g><circle cx="600" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="600" y="323" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">3</text></g><g><circle cx="840" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="840" y="323" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">4</text></g><g><circle cx="1080" cy="310" r="58" fill="#D97706" stroke="#FFF" stroke-width="9"/><text x="1080" y="323" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">5</text></g>
<g><rect x="22" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="120" y="446" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Reference</text><text x="120" y="478" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="19" fill="#526477">product</text></g><g><rect x="262" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="360" y="446" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Analytical</text><text x="360" y="478" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="19" fill="#526477">comparison</text></g><g><rect x="502" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="600" y="446" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Functional</text><text x="600" y="478" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="19" fill="#526477">assay</text></g><g><rect x="742" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="840" y="446" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">প্রয়োজনমতো</text><text x="840" y="478" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="19" fill="#526477">clinical data</text></g><g><rect x="982" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="1080" y="446" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">সব প্রমাণের</text><text x="1080" y="478" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="19" fill="#526477"