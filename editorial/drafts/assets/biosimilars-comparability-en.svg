<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How a biosimilar is evaluated</title>
<desc id="desc">Five connected stages: reference-product characterisation, analytical comparison, functional assays, tailored clinical evidence and a decision based on the totality of evidence.</desc>
<rect width="1200" height="675" rx="30" fill="#F7F3EA"/>
<text x="64" y="86" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D">How a biosimilar is evaluated</text>
<path d="M120 310 H1080" stroke="#B7C7C1" stroke-width="12" stroke-linecap="round"/>
<g><circle cx="120" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="120" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">1</text></g><g><circle cx="360" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="360" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">2</text></g><g><circle cx="600" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="600" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">3</text></g><g><circle cx="840" cy="310" r="58" fill="#0F766E" stroke="#FFF" stroke-width="9"/><text x="840" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">4</text></g><g><circle cx="1080" cy="310" r="58" fill="#D97706" stroke="#FFF" stroke-width="9"/><text x="1080" y="323" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#FFF">5</text></g>
<g><rect x="22" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="120" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Reference</text><text x="120" y="478" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#526477">product</text></g><g><rect x="262" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="360" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Analytical</text><text x="360" y="478" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#526477">comparison</text></g><g><rect x="502" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="600" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Functional</text><text x="600" y="478" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#526477">assays</text></g><g><rect x="742" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="840" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Tailored</text><text x="840" y="478" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#526477">clinical data</text></g><g><rect x="982" y="405" width="196" height="105" rx="18" fill="#FFF" stroke="#D6DED9" stroke-width="2"/><text x="1080" y="446" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D">Totality of</text><text x="1080" y="478" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#526477">evidence</text></g>
<text x="600" y="580" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#526477">No single test decides; the complete evidence package is considered.</text>
</svg>