<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">জেনেরিক, রেফারেন্স বায়োলজিক ও বায়োসিমিলারের ধারণাগত পার্থক্য</title>
<desc id="desc">তিনটি প্যানেলে ছোট রাসায়নিক অণুর জেনেরিক, কোষে তৈরি জটিল reference protein এবং সেই reference-এর সঙ্গে তুলনা করা biosimilar দেখানো হয়েছে। ধারণাগত চিত্র, আকার অনুপাতে নয়।</desc>
<rect width="1200" height="675" rx="30" fill="#F7F3EA"/>
<text x="64" y="86" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D">তিনটি আলাদা ধারণা</text>
<g transform="translate(58 135)"><rect width="330" height="430" rx="24" fill="#FFF" stroke="#D6DED9" stroke-width="3"/><circle cx="165" cy="145" r="78" fill="#E8F1EF"/><polygon points="165,84 218,115 218,176 165,207 112,176 112,115" fill="none" stroke="#0F766E" stroke-width="13" stroke-linejoin="round"/><circle cx="165" cy="145" r="12" fill="#D97706"/><text x="165" y="285" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="26" font-weight="700" fill="#17324D">জেনেরিক ওষুধ</text><text x="165" y="332" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" fill="#526477">ছোট রাসায়নিক অণু</text></g>
<g transform="translate(435 135)"><rect width="330" height="430" rx="24" fill="#FFF" stroke="#D6DED9" stroke-width="3"/><circle cx="165" cy="145" r="78" fill="#E7EEF7"/><path d="M112 128 C130 72 172 78 170 120 S220 179 205 127 S140 112 151 175 S213 213 224 158" fill="none" stroke="#17324D" stroke-width="14" stroke-linecap="round"/><path d="M113 164 C135 207 164 192 164 158 S205 91 222 111" fill="none" stroke="#0F766E" stroke-width="11" stroke-linecap="round"/><text x="165" y="285" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="25" font-weight="700" fill="#17324D">Reference biologic</text><text x="165" y="332" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" fill="#526477">কোষে তৈরি জটিল প্রোটিন</text></g>
<g transform="translate(812 135)"><rect width="330" height="430" rx="24" fill="#FFF" stroke="#D6DED9" stroke-width="3"/><circle cx="165" cy="145" r="78" fill="#FFF0DE"/><path d="M112 128 C130 72 172 78 170 120 S220 179 205 127 S140 112 151 175 S213 213 224 158" fill="none" stroke="#17324D" stroke-width="14" stroke-linecap="round"/><path d="M113 164 C135 207 164 192 164 158 S205 91 222 111" fill="none" stroke="#0F766E" stroke-width="11" stroke-linecap="round"/><circle cx="213" cy="100" r="13" fill="#D97706"/><circle cx="124" cy="190" r="9" fill="#D97706"/><text x="165" y="285" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="27" font-weight="700" fill="#17324D">Biosimilar</text><text x="165" y="332" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="20" fill="#526477">Reference-এর সঙ্গে তুলনা</text></g>
<text x="600" y="625" text-anchor="middle" font-family="Noto Sans Bengali,Arial,sans-serif" font-size="19" fill="#64748B">ধারণাগত চিত্র; আকার অনুপাতে নয়</text>
</svg>