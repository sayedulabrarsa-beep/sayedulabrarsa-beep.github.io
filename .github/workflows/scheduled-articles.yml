name: Scheduled pharmacology article releases

on:
  push:
    branches: [main]
    paths:
      - '_src/apply_editorial_calendar.py'
      - '_src/editorial_calendar.json'
      - 'blog/**'
      - '.github/workflows/scheduled-articles.yml'
  schedule:
    - cron: '0 14 * * *' # 8:00 PM Asia/Dhaka daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-pharmacology-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: pip install pillow
      - name: Apply calendar, hide future pages, and release due pages
        run: python3 _src/apply_editorial_calendar.py
      - name: Commit scheduled release changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog assets index.html sitemap.xml llms.txt _src
            git commit -m "Apply editorial calendar and scheduled article release"
            git pull --rebase origin main
            git push
          fi
