name: Update homepage "Featured from the Pharma Blog"

# Whenever an article under /blog changes, rebuild the homepage stacks so new articles appear automatically.
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '_src/data/blog_stacks.json'
      - '_src/blog_stacks.py'
      - '_src/seo_feeds.py'
      - '_src/article_index.py'
      - '_src/data/articles.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-stacks
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow cairosvg
      - run: python3 _src/blog_stacks.py
      - run: python3 _src/seo_feeds.py   # RSS feed, llms.txt article list, Blog schema
      - run: python3 _src/article_index.py   # all-articles list for the 'You can also read' band + crawlable links
      - run: python3 _src/logo_everywhere.py # official logo, favicons and copyright line on new pages
      - run: python3 _src/alt_text_tune.py   # consistent author-photo alt text
      - run: python3 _src/image_credits.py   # image creator/credit/licence metadata for Google Images
      - run: python3 _src/sitemap_images.py  # every article picture listed in sitemap.xml
      - name: Commit if the homepage changed
        run: |
          if [ -n "$(git status --porcelain index.html assets blog llms.txt sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets blog llms.txt sitemap.xml
            git commit -m "Auto-update homepage stacks, RSS feed and llms.txt"
            for i in 1 2 3 4; do git pull --rebase --autostash origin main && git push && break; sleep $((i*10)); done
          fi
