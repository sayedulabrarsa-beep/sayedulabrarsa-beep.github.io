name: Update homepage "Featured from the Pharma Blog"

# Whenever an article under /blog changes, rebuild the homepage stacks so new articles appear automatically.
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '_src/data/blog_stacks.json'
      - '_src/blog_stacks.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-stacks
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 _src/blog_stacks.py
      - name: Commit if the homepage changed
        run: |
          if [ -n "$(git status --porcelain index.html assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets
            git commit -m "Auto-update homepage Featured from the Pharma Blog"
            git pull --rebase origin main
            git push
          fi
